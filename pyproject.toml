[project]
name = "voxtria"
version = "0.2.0"
description = "Assistant vocal local et modulaire (ASR · LLM · TTS)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
# B008 : Depends/Body/File en valeur par défaut est l'idiome FastAPI.
"server.py" = ["B008"]
